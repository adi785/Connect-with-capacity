name: Backend tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: capacity_connect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d capacity_connect_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run backend tests
        run: python -m pytest -q

      - name: Run PostgreSQL security migration regression
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d capacity_connect_test -v ON_ERROR_STOP=1 -f tests/sql/security_hardening_setup.sql
          psql -h localhost -U postgres -d capacity_connect_test -v ON_ERROR_STOP=1 -f migrations/20261125_security_hardening.sql
          psql -h localhost -U postgres -d capacity_connect_test -v ON_ERROR_STOP=1 -f tests/sql/security_hardening_assertions.sql
