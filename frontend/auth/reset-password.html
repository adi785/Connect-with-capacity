<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Capacity Connect</title>

    <link rel="stylesheet" href="css/auth-support.css">

    <style>
        .reset-container {
            max-width: 560px;
            margin: 70px auto;
            padding: 0 20px;
        }

        .reset-card {
            background: #ffffff;
            border: 1px solid #d8e0e7;
            border-radius: 10px;
            padding: 42px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        }

        .reset-label {
            color: #c46a00;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
        }

        .reset-card h1 {
            margin: 0 0 10px;
            font-size: 32px;
            color: #173f61;
        }

        .reset-description {
            color: #607d94;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #243b53;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            border: 1px solid #b9c8d5;
            border-radius: 5px;
            font-size: 16px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #173f61;
        }

        .reset-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 5px;
            background: #173f61;
            color: white;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
        }

        .reset-button:hover {
            background: #0f304b;
        }

        .reset-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin: 15px 0;
            font-size: 15px;
            color: #d32f2f;
        }

        .success {
            color: #2e7d32;
        }

        .hidden {
            display: none;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #173f61;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <main class="reset-container">

        <section class="reset-card">

            <!-- RESET FORM -->
            <div id="reset-panel">

                <div class="reset-label">
                    ACCOUNT RECOVERY
                </div>

                <h1>Create a new password</h1>

                <p class="reset-description">
                    Choose a new secure password for your Capacity Connect account.
                </p>

                <form id="reset-form">

                    <div class="form-group">
                        <label for="new-password">
                            New password
                        </label>

                        <input type="password" id="new-password" name="password" placeholder="Enter new password"
                            minlength="6" required>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">
                            Confirm new password
                        </label>

                        <input type="password" id="confirm-password" name="confirmPassword"
                            placeholder="Confirm new password" minlength="6" required>
                    </div>

                    <div id="reset-error" class="message"></div>

                    <button type="submit" id="reset-button" class="reset-button">
                        Reset password
                    </button>

                </form>

            </div>


            <!-- SUCCESS MESSAGE -->
            <div id="success-panel" class="hidden">

                <div class="reset-label">
                    PASSWORD UPDATED
                </div>

                <h1>Password reset successfully</h1>

                <p class="reset-description">
                    Your Capacity Connect password has been changed successfully.
                    You can now log in with your new password.
                </p>

                <a href="index.html" class="back-link">
                    ← Back to login
                </a>

            </div>

        </section>

    </main>


    <!-- Supabase library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Your Supabase configuration -->
    <script src="js/supabase.js"></script>

    <!-- Authentication -->
    <script src="js/auth.js"></script>


    <script>
        document.addEventListener("DOMContentLoaded", async () => {

            const form = document.getElementById("reset-form");
            const button = document.getElementById("reset-button");
            const errorBox = document.getElementById("reset-error");

            const resetPanel =
                document.getElementById("reset-panel");

            const successPanel =
                document.getElementById("success-panel");


            /*
             * Wait for Supabase to process the recovery link.
             */
            const { data, error } =
                await supabaseClient.auth.getSession();


            if (error || !data || !data.session) {

                errorBox.textContent =
                    "This password reset link is invalid or has expired.";

                button.disabled = true;

                return;
            }


            /*
             * Password reset form
             */
            form.addEventListener("submit", async (event) => {

                event.preventDefault();

                errorBox.textContent = "";

                const password =
                    document.getElementById("new-password").value;

                const confirmation =
                    document.getElementById("confirm-password").value;


                if (password.length < 6) {

                    errorBox.textContent =
                        "Password must be at least 6 characters.";

                    return;
                }


                if (password !== confirmation) {

                    errorBox.textContent =
                        "Passwords do not match.";

                    return;
                }


                button.disabled = true;
                button.textContent = "Updating password...";


                try {

                    const { error } =
                        await supabaseClient.auth.updateUser({
                            password: password
                        });


                    if (error) {
                        throw error;
                    }


                    /*
                     * Password successfully changed.
                     */
                    resetPanel.classList.add("hidden");
                    successPanel.classList.remove("hidden");


                    /*
                     * Sign out the recovery session.
                     */
                    await supabaseClient.auth.signOut();


                } catch (error) {

                    console.error(
                        "Password reset error:",
                        error
                    );

                    errorBox.textContent =
                        error.message ||
                        "Unable to reset your password.";

                    button.disabled = false;
                    button.textContent = "Reset password";
                }

            });

        });
    </script>

</body>

</html>
